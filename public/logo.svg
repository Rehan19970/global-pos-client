<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Circle -->
    <clipPath id="circle-clip">
      <circle cx="100" cy="100" r="95" />
    </clipPath>
  </defs>

  <!-- White Background -->
  <rect width="200" height="200" rx="40" fill="#ffffff" />

  <!-- Outer Green Circle -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="#10b981" stroke-width="3" />

  <!-- STORE Badge at Top -->
  <rect x="70" y="20" width="60" height="22" rx="11" fill="#10b981" />
  <text x="100" y="35" font-family="Arial, sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle" letter-spacing="1">STORE</text>

  <!-- Store Roof -->
  <polygon points="50,65 150,65 100,40" fill="#1e293b" />
  
  <!-- Awning (Stripes) -->
  <path d="M50 65 L150 65 L150 75 Q140 85 130 75 Q120 85 110 75 Q100 85 90 75 Q80 85 70 75 Q60 85 50 75 Z" fill="#10b981" />
  <path d="M50 75 L150 75 L150 80 L50 80 Z" fill="#ffffff" opacity="0.5" />

  <!-- Store Windows & Door -->
  <rect x="55" y="80" width="35" height="45" rx="3" fill="#0ea5e9" />
  <rect x="60" y="85" width="10" height="10" fill="#bae6fd" />
  <rect x="75" y="85" width="10" height="10" fill="#bae6fd" />
  <rect x="60" y="100" width="10" height="10" fill="#bae6fd" />
  <rect x="75" y="100" width="10" height="10" fill="#bae6fd" />

  <rect x="105" y="80" width="30" height="45" rx="3" fill="#38bdf8" />
  <rect x="115" y="90" width="10" height="15" fill="#ffffff" opacity="0.6" />

  <rect x="95" y="80" width="6" height="45" fill="#1e293b" />

  <!-- Shopping Cart (Abstract) -->
  <path d="M120 110 L150 110 L155 85 L130 85" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="130" cy="118" r="4" fill="#1e293b" />
  <circle cx="148" cy="118" r="4" fill="#1e293b" />
  <rect x="135" y="90" width="8" height="8" rx="1" fill="#10b981" />
  <rect x="145" y="95" width="8" height="8" rx="1" fill="#38bdf8" />

  <!-- Leaves / Grass at bottom -->
  <path d="M45 130 Q35 115 45 105 Q55 115 50 130 Z" fill="#10b981" />
  <path d="M155 130 Q165 115 155 105 Q145 115 150 130 Z" fill="#10b981" />
  <path d="M45 130 L155 130" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />

  <!-- ROSHYS Text -->
  <text x="100" y="160" font-family="Arial, sans-serif" font-weight="900" font-size="24" fill="#1e293b" text-anchor="middle" letter-spacing="1">ROSHYS</text>
  
  <!-- POS SYSTEM Text -->
  <text x="100" y="175" font-family="Arial, sans-serif" font-weight="700" font-size="9" fill="#10b981" text-anchor="middle" letter-spacing="3">POS SYSTEM</text>

</svg>